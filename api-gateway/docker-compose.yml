version: '3.9'
services:
  mongo:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    ports:
      - 27017:27017
    volumes:
      - ../job-service/src/main/resources/data/init.js:/docker-entrypoint-initdb.d/job_init.js
      - ../candidate-service/src/main/resources/data/init.js:/docker-entrypoint-initdb.d/candidate_init.js
  candidate-service:
     build: ../candidate-service
     ports:
       - "8013:8013"
     depends_on:
      - mongo 
      - job-service
     environment:
      - spring.data.mongodb.uri=mongodb://admin:123@mongo:27017/candidate
      - job.service.url=http://job-service:8012
    
     
  job-service:
    build: ../job-service
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: '512M'
    ports:
      - "8012"
    depends_on:
      - mongo
    environment:
      - spring.data.mongodb.uri=mongodb://mahir:1234@mongo:27017/job
  nginx:
   image: nginx
   ports:
     - "8086:8080"
   depends_on:
      - job-service
      - candidate-service
   volumes:
    - ./conf/nginx.conf:/etc/nginx/nginx.conf
    - ./html/index.html:/usr/share/nginx/html/index.html
      